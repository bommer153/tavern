# Render Blueprint: free API + web for online testing. Render → New → Blueprint → pick this repo.
# If a service name is taken, Render gives it another onrender.com URL: update the URLs below to match.
# Free plan limits: both services sleep after 15 idle minutes (~1 min to wake), and uploaded files are lost on
# every restart (set STORAGE_DRIVER=supabase to keep them).
services:
  - type: web
    name: tavern-api
    runtime: docker
    plan: free
    dockerfilePath: ./infrastructure/docker/api.Dockerfile
    dockerContext: .
    envVars:
      - key: NODE_ENV
        value: staging # "production" refuses the dev payment provider; staging keeps sandbox top-ups for testers
      - key: MONGODB_URI
        sync: false # Atlas URI incl. /tavern; Atlas → Network Access must allow 0.0.0.0/0
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://tavern-web.onrender.com
      - key: WEB_URL
        value: https://tavern-web.onrender.com
      - key: API_PUBLIC_URL
        value: https://tavern-api.onrender.com
      - key: COOKIE_SECURE
        value: "true"
      - key: PAYMENT_PROVIDER
        value: dev
      - key: STORAGE_DRIVER
        value: local
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false

  - type: web
    name: tavern-web
    runtime: node
    plan: free
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm turbo run build --filter=@tavern/web
    startCommand: node_modules/.bin/next start apps/web -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: API_ORIGIN
        value: https://tavern-api.onrender.com
      # Same origin as the page: Next forwards these to API_ORIGIN (see apps/web/next.config.ts).
      - key: NEXT_PUBLIC_API_URL
        value: https://tavern-web.onrender.com/api/v1
      - key: NEXT_PUBLIC_SOCKET_URL
        value: https://tavern-web.onrender.com
